<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Happy Birthday, Shristi! 🎂</title>
  <meta
    name="description"
    content="A special birthday surprise for Shristi."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Shippori+Antique&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --birthday-wallpaper: url("./happy-birthday-background-with-balloons-illustration-ai-generative-free-photo.jpg");
      --purple: #694095;
      --text: #392747;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: "Shippori Antique", sans-serif;
      color: var(--text);
      background: #eee3fa;
      isolation: isolate;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(
          to bottom,
          rgba(246, 230, 255, 0.35),
          rgba(45, 24, 69, 0.55)
        ),
        var(--birthday-wallpaper);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-right: max(12px, env(safe-area-inset-right));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
    }

    .gift-screen {
      width: min(100%, 440px);
      max-height: 100%;
      overflow-y: auto;
      text-align: center;
      padding: 8px;
    }

    .gift-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(230px, 55vw, 45vh);
      height: min(230px, 55vw, 45vh);
      width: min(230px, 55vw, 45dvh);
      height: min(230px, 55vw, 45dvh);
      padding: 12px;
      border: 3px solid rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      background: #fffaf0;
      box-shadow: 0 12px 35px rgba(45, 24, 69, 0.2);
      cursor: pointer;
      transition: transform 180ms ease;
    }

    .gift-button:hover {
      transform: scale(1.03) rotate(-2deg);
    }

    .friendship-art {
      width: 100%;
      height: 100%;
    }

    .gift-label {
      margin: 18px 0 0;
      padding: 12px 16px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      line-height: 1.7;
    }

    .gift-label strong {
      display: block;
      color: var(--purple);
      font-size: 18px;
    }

    .gift-label span {
      font-size: 14px;
    }

    .card {
      display: flex;
      flex-direction: column;
      width: min(100%, 720px);
      height: 100%;
      max-height: 850px;
      min-height: 0;
      padding: clamp(16px, 3vw, 32px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      background: rgba(255, 252, 255, 0.97);
      box-shadow: 0 20px 65px rgba(45, 24, 69, 0.22);
      text-align: center;
      overflow-wrap: break-word;
    }

    .card-header {
      flex-shrink: 0;
      max-height: 35%;
      overflow-y: auto;
    }

    .decoration {
      margin: 0 0 6px;
      font-size: clamp(26px, 5vw, 38px);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #846592;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-family: "Dancing Script", cursive;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.15;
      color: var(--purple);
    }

    .message {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      padding: 4px 8px;
      font-size: clamp(14px, 2.5vw, 17px);
      line-height: 1.75;
      text-align: left;
      scrollbar-width: thin;
      scrollbar-color: #c6afd8 transparent;
    }

    .message:focus-visible {
      outline: 2px solid #a28ade;
      outline-offset: -2px;
      border-radius: 8px;
    }

    .message p {
      margin: 0 0 16px;
    }

    .message p:last-child {
      margin-bottom: 0;
    }

    .message .quote {
      margin: 16px 0;
      padding: 14px;
      border-radius: 16px;
      background: #f3eaf9;
      color: #654180;
      font-size: inherit;
    }

    .card-footer {
      flex-shrink: 0;
    }

    .navigation {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .nav-button {
      min-height: 44px;
      min-width: 0;
      padding: 11px 20px;
      border: none;
      border-radius: 999px;
      background: var(--purple);
      color: white;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .nav-button:hover {
      background: #543177;
    }

    .previous-button {
      background: #eee4f5;
      color: var(--purple);
    }

    .previous-button:hover {
      background: #e2d2ee;
    }

    button:focus-visible {
      outline: 3px solid #d29334;
      outline-offset: 3px;
    }

    .progress {
      margin: 10px 0 0;
      color: #8b7697;
      font-size: 11px;
    }

    @media (max-height: 500px) {
      main {
        padding: 8px;
        padding-left: max(8px, env(safe-area-inset-left));
        padding-right: max(8px, env(safe-area-inset-right));
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }

      .card {
        padding: 10px 14px;
        border-radius: 16px;
      }

      .decoration,
      .eyebrow {
        display: none;
      }

      h1 {
        font-size: 26px;
        margin-bottom: 8px;
      }

      .navigation {
        margin-top: 8px;
      }

      .progress {
        margin-top: 5px;
      }
    }

    @media (max-width: 340px) {
      .card {
        padding: 12px;
      }

      .nav-button {
        padding: 10px 14px;
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gift-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="background" aria-hidden="true"></div>

  <audio
    id="birthdayAudio"
    src="./DARLING.mp3"
    preload="none"
  ></audio>

  <main>
    <section id="giftScreen" class="gift-screen">
      <button
        id="openGift"
        class="gift-button"
        type="button"
        aria-label="High five! Open Shristi's birthday surprise"
      >
        <!-- Friendship high-five illustration. -->
        <svg
          class="friendship-art"
          viewBox="0 0 240 240"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="120" cy="120" r="112" fill="#FFF3D6" />

          <path
            d="M44 64l7 7M190 64l-6 8M59 40l3 9M177 38l-3 10"
            stroke="#A28ADE"
            stroke-width="5"
            stroke-linecap="round"
          />

          <circle cx="35" cy="108" r="4" fill="#EFB847" />
          <circle cx="205" cy="105" r="4" fill="#56ADA4" />
          <circle cx="82" cy="34" r="3" fill="#56ADA4" />
          <circle cx="157" cy="28" r="3" fill="#EFB847" />

          <path
            d="M120 30v13M99 39l8 9M141 39l-8 9"
            fill="none"
            stroke="#EFB847"
            stroke-width="5"
            stroke-linecap="round"
          />

          <path
            d="M85 151Q107 125 117 74"
            fill="none"
            stroke="#D79C73"
            stroke-width="15"
            stroke-linecap="round"
          />

          <path
            d="M155 151Q134 125 123 74"
            fill="none"
            stroke="#A96F50"
            stroke-width="15"
            stroke-linecap="round"
          />

          <path
            d="M116 81l-2-19M122 81l3-19"
            fill="none"
            stroke="#D79C73"
            stroke-width="9"
            stroke-linecap="round"
          />

          <path
            d="M125 81l3-18"
            fill="none"
            stroke="#A96F50"
            stroke-width="8"
            stroke-linecap="round"
          />

          <path
            d="M38 207v-38a34 34 0 0168 0v38"
            fill="#55ADA5"
          />

          <path
            d="M134 207v-38a34 34 0 0168 0v38"
            fill="#A28ADE"
          />

          <circle cx="72" cy="113" r="27" fill="#D79C73" />
          <circle cx="168" cy="113" r="27" fill="#A96F50" />

          <path
            d="M45 108c-3-36 52-44 55-5-12-3-22-10-27-18-5 13-16 20-28 23"
            fill="#443047"
          />

          <path
            d="M141 109c-3-37 54-42 55-3-12-1-24-8-29-18-5 12-15 19-26 21"
            fill="#443047"
          />

          <g fill="#392747">
            <circle cx="63" cy="115" r="2.4" />
            <circle cx="81" cy="115" r="2.4" />
            <circle cx="159" cy="115" r="2.4" />
            <circle cx="177" cy="115" r="2.4" />
          </g>

          <path
            d="M65 124q7 8 14 0M161 124q7 8 14 0"
            fill="none"
            stroke="#633F37"
            stroke-width="3"
            stroke-linecap="round"
          />

          <path
            d="M61 153q11 10 22 0M157 153q11 10 22 0"
            fill="none"
            stroke="#FFFFFF"
            stroke-opacity=".7"
            stroke-width="4"
            stroke-linecap="round"
          />
        </svg>
      </button>

      <p class="gift-label">
        <strong>A birthday high-five, Shristi! 🙌</strong>
        <span>Tap to open your little surprise 🎉</span>
      </p>
    </section>

    <section
      id="birthdayCard"
      class="card"
      aria-labelledby="messageTitle"
      hidden
    >
      <header class="card-header">
        <p id="decoration" class="decoration" aria-hidden="true"></p>

        <p class="eyebrow">A little surprise, with warm wishes</p>

        <h1 id="messageTitle" tabindex="-1"></h1>
      </header>

      <div
        id="messageBody"
        class="message"
        role="region"
        aria-label="Birthday message"
        tabindex="0"
      ></div>

      <footer class="card-footer">
        <div class="navigation">
          <button
            id="previousButton"
            class="nav-button previous-button"
            type="button"
            hidden
          >
            ← Previous
          </button>

          <button
            id="nextButton"
            class="nav-button"
            type="button"
          >
            Next →
          </button>
        </div>

        <p id="progress" class="progress"></p>
      </footer>
    </section>
  </main>

  <template id="openingMessage">
    <p>
      I hope this year brings you the things you’ve wished for quietly,
      worked for patiently, and kept believing in even when they felt
      far away.
    </p>

    <p>
      You’re already halfway there—please don’t forget to pause and
      give yourself credit for everything it took to get here.
      There’s so much more waiting for you, and I truly believe you
      have what it takes to achieve whatever you set your heart on.
      On the days you doubt yourself, I hope you remember how far
      you’ve already come.
    </p>

    <p>
      More than anything, I wish you happiness you don’t have to
      pretend, peace that lets your mind rest, good health, and
      people who appreciate you for who you are.
    </p>

    <p>
      May you get everything you’re hoping for—and when you do,
      I hope you have the time and peace to truly enjoy it.
    </p>

    <p class="quote">
      I wish you everything your heart hopes for. May the life
      you’re working so hard to build become everything you
      want it to be—and even more beautiful than you imagined. ✨
    </p>

    <p>
      Until then, I hope life gives you plenty of reasons to smile
      along the way. Happy Birthday! 🎂
    </p>
  </template>

  <template id="workplaceMessage">
    <p>
      All my best buddies are people I’ve met at work.
      I know you prefer not to make friends at work, and that’s okay!
    </p>

    <p>
      We sit next to each other every day, and I spend so much of
      my workday beside you—so of course I wanted to make your
      birthday a little special! 🎉
    </p>
  </template>

  <template id="supportMessage">
    <p>
      You made my early days in the new role so much easier.
      You probably don’t realize how much you helped!
    </p>

    <p>
      Whenever I felt stressed, I’d turn to you—only to find you
      were even more stressed. Somehow, we still found a reason
      to laugh! 😂
    </p>
  </template>

  <template id="thanksMessage">
    <p>
      Thank you for making time for my questions, helping me when
      I was figuring things out, and making the workday a little
      easier. 😊
    </p>

    <p>
      Your support has meant more than you probably realize.
      I may not say it every day, but I really do appreciate it.
    </p>
  </template>

  <template id="finalMessage">
    <p>
      Shristi, I hope you give yourself credit for the effort you put
      in and the kindness you show. You helped me while managing
      your own work and stress, and that says a lot about you.
      Your support made a difference, even when you may not
      have realized it.
    </p>

    <p>
      You’re already halfway towards what you want, and I truly
      believe you have what it takes to go further. Don’t let
      a difficult day make you forget your progress or doubt
      your abilities. Your ideas matter, your effort matters,
      and you deserve to feel proud of yourself—not only when
      you reach your goals, but as you work towards them.
    </p>

    <p>
      Happy Birthday, Shristi! May your hard work open the doors
      you’ve been hoping for, and may you have the confidence
      to walk through them. I hope you get everything your heart
      wishes for, with the happiness and peace to enjoy it.
      Keep believing in yourself—there’s so much ahead of you
      worth looking forward to. 🎂✨
    </p>

    <p>
      This little surprise is my way of saying that your kindness
      hasn’t gone unnoticed. You made my days a little easier,
      and I wanted to do something small to brighten yours.
      Every birthday wish here comes from the heart. 🌻
    </p>
  </template>

  <script>
    const audio = document.getElementById("birthdayAudio");
    const giftScreen = document.getElementById("giftScreen");
    const birthdayCard = document.getElementById("birthdayCard");
    const messageTitle = document.getElementById("messageTitle");
    const messageBody = document.getElementById("messageBody");
    const decoration = document.getElementById("decoration");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const progress = document.getElementById("progress");

    const messages = [
      {
        title: "Happiest Birthday, Shristi!",
        template: "openingMessage",
        emoji: "🎂✨"
      },
      {
        title: "From the person sitting next to you…",
        template: "workplaceMessage",
        emoji: "🙌😄"
      },
      {
        title: "Something I appreciate about you",
        template: "supportMessage",
        emoji: "☕🌟"
      },
      {
        title: "A little thank you",
        template: "thanksMessage",
        emoji: "🌼😊"
      },
      {
        title: "Have a wonderful birthday!",
        template: "finalMessage",
        emoji: "🎉🎂"
      }
    ];

    let currentMessage = 0;
    let animationFrame = null;
    let typingGeneration = 0;

    // Smaller values produce faster typewriting.
    const typingSpeed = 12;

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const segmenter =
      typeof Intl.Segmenter === "function"
        ? new Intl.Segmenter("en", { granularity: "grapheme" })
        : null;

    function splitCharacters(text) {
      return segmenter
        ? Array.from(segmenter.segment(text), item => item.segment)
        : Array.from(text);
    }

    function stopTyping() {
      typingGeneration += 1;

      if (animationFrame !== null) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }

      messageBody.removeAttribute("aria-busy");
    }

    function typeMessage(template) {
      const generation = typingGeneration;
      const paragraphs = Array.from(template.content.children);
      const parts = [];

      let totalCharacters = 0;

      messageBody.replaceChildren();

      paragraphs.forEach(source => {
        const element = source.cloneNode(false);
        const text = source.textContent.replace(/\s+/g, " ").trim();
        const characters = splitCharacters(text);

        element.hidden = true;
        messageBody.appendChild(element);

        parts.push({
          element,
          characters,
          start: totalCharacters,
          shown: 0
        });

        totalCharacters += characters.length;
      });

      messageBody.setAttribute("aria-busy", "true");

      const startTime = performance.now();

      function tick(now) {
        if (generation !== typingGeneration) {
          return;
        }

        const visibleCharacters = Math.min(
          totalCharacters,
          Math.floor((now - startTime) / typingSpeed) + 1
        );

        parts.forEach(part => {
          const count = Math.max(
            0,
            Math.min(
              part.characters.length,
              visibleCharacters - part.start
            )
          );

          if (count > part.shown) {
            part.element.hidden = false;

            // Add letters forwards only—never erase them.
            part.element.append(
              document.createTextNode(
                part.characters.slice(part.shown, count).join("")
              )
            );

            part.shown = count;
          }
        });

        // Leave scrolling under the reader's control.
        if (visibleCharacters < totalCharacters) {
          animationFrame = requestAnimationFrame(tick);
        } else {
          animationFrame = null;
          messageBody.removeAttribute("aria-busy");
        }
      }

      animationFrame = requestAnimationFrame(tick);
    }

    function showMessage(index) {
      stopTyping();

      const message = messages[index];
      const template = document.getElementById(message.template);

      messageTitle.textContent = message.title;
      decoration.textContent = message.emoji;

      previousButton.hidden = index === 0;
      nextButton.hidden = index === messages.length - 1;
      progress.textContent = `${index + 1} of ${messages.length}`;

      // Respect the device's reduced-motion accessibility setting.
      if (reducedMotion.matches) {
        messageBody.replaceChildren(
          template.content.cloneNode(true)
        );
      } else {
        typeMessage(template);
      }

      messageBody.scrollTop = 0;
      messageTitle.parentElement.scrollTop = 0;
      messageTitle.focus({ preventScroll: true });
    }

    document.getElementById("openGift").addEventListener("click", () => {
      giftScreen.hidden = true;
      birthdayCard.hidden = false;

      showMessage(currentMessage);

      audio.volume = 0.5;

      audio.play().catch(() => {
        // Messages still work if audio is unavailable.
      });
    });

    previousButton.addEventListener("click", () => {
      if (currentMessage > 0) {
        currentMessage -= 1;
        showMessage(currentMessage);
      }
    });

    nextButton.addEventListener("click", () => {
      if (currentMessage < messages.length - 1) {
        currentMessage += 1;
        showMessage(currentMessage);
      }
    });
  </script>
</body>
</html>
