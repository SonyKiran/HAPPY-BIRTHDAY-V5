<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Happy Birthday, Shristi! 🎂</title>
  <meta
    name="description"
    content="A special birthday wish for Shristi."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Shippori+Antique&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --birthday-wallpaper: url("./happy-birthday-background-with-balloons-illustration-ai-generative-free-photo.jpg");
      --purple: #694095;
      --text: #392747;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Shippori Antique", sans-serif;
      color: var(--text);
      background: #eee3fa;
      isolation: isolate;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(
          to bottom,
          rgba(246, 230, 255, 0.3),
          rgba(45, 24, 69, 0.55)
        ),
        var(--birthday-wallpaper);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    main {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 18px;
    }

    .gift-screen {
      text-align: center;
    }

    .gift-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 210px;
      height: 210px;
      padding: 16px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 16px 55px rgba(45, 24, 69, 0.2);
      cursor: pointer;
      transition: transform 180ms ease;
    }

    .gift-button:hover {
      transform: scale(1.05);
    }

    .gift-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .gift-fallback {
      font-size: 100px;
    }

    .gift-label {
      margin-top: 24px;
      padding: 13px 20px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      line-height: 1.6;
    }

    .card {
      width: min(100%, 720px);
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: rgba(255, 252, 255, 0.96);
      box-shadow: 0 20px 65px rgba(45, 24, 69, 0.22);
      text-align: center;
      overflow-wrap: break-word;
    }

    .decoration {
      margin: 0 0 14px;
      font-size: 40px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #846592;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 24px;
      font-family: "Dancing Script", cursive;
      font-size: clamp(36px, 7vw, 54px);
      line-height: 1.15;
      color: var(--purple);
    }

    .message {
      min-height: 160px;
      font-size: clamp(15px, 2.5vw, 17px);
      line-height: 1.9;
    }

    .message p {
      margin: 0 0 18px;
    }

    .message p:last-child {
      margin-bottom: 0;
    }

    .message .quote {
      margin: 24px 0;
      padding: 20px;
      border-radius: 16px;
      background: #f3eaf9;
      color: #654180;
      font-size: 19px;
    }

    .navigation {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .nav-button {
      padding: 13px 25px;
      border: none;
      border-radius: 999px;
      background: var(--purple);
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .nav-button:hover {
      background: #543177;
    }

    .previous-button {
      background: #eee4f5;
      color: var(--purple);
    }

    .previous-button:hover {
      background: #e2d2ee;
    }

    button:focus-visible {
      outline: 3px solid #d29334;
      outline-offset: 5px;
    }

    .progress {
      margin: 18px 0 0;
      color: #8b7697;
      font-size: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      .gift-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="background" aria-hidden="true"></div>

  <audio
    id="birthdayAudio"
    src="./DARLING.mp3"
    preload="none"
  ></audio>

  <main>
    <section id="giftScreen" class="gift-screen">
      <button
        id="openGift"
        class="gift-button"
        type="button"
        aria-label="Open your birthday surprise"
      >
        <img
          id="giftImage"
          src="./Valentine-Surprise.png"
          alt=""
        />
        <span id="giftFallback" class="gift-fallback" hidden>
          🎁
        </span>
      </button>

      <p class="gift-label">Open the gift, Birthday Star! 🎁</p>
    </section>

    <section
      id="birthdayCard"
      class="card"
      aria-labelledby="messageTitle"
      hidden
    >
      <p id="decoration" class="decoration" aria-hidden="true">
        🎂✨
      </p>

      <p class="eyebrow">Just a little birthday surprise</p>

      <h1 id="messageTitle" tabindex="-1"></h1>

      <div id="messageBody" class="message"></div>

      <div class="navigation">
        <button
          id="previousButton"
          class="nav-button previous-button"
          type="button"
          hidden
        >
          ← Previous
        </button>

        <button
          id="nextButton"
          class="nav-button"
          type="button"
        >
          Next →
        </button>
      </div>

      <p id="progress" class="progress"></p>
    </section>
  </main>

  <template id="openingMessage">
    <p>
      I hope this year brings you the things you’ve wished for quietly,
      worked for patiently, and kept believing in even when they felt
      far away.
    </p>

    <p>
      You’re already halfway there—please don’t forget to pause and
      give yourself credit for everything it took to get here.
      There’s so much more waiting for you, and I truly believe you
      have what it takes to achieve whatever you set your heart on.
      On the days you doubt yourself, I hope you remember how far
      you’ve already come.
    </p>

    <p>
      More than anything, I wish you happiness you don’t have to
      pretend, peace that lets your mind rest, good health, and
      people who appreciate you for who you are.
    </p>

    <p>
      May you get everything you’re hoping for—and when you do,
      I hope you have the time and peace to truly enjoy it.
      One day, may you look around at the life you’ve built,
      smile, and say:
    </p>

    <p class="quote">
      “I used to wish for this. Now I’m living it.”
    </p>

    <p>
      Until then, I hope life gives you plenty of reasons to smile
      along the way. Happy Birthday! 💛
    </p>
  </template>

  <template id="workplaceMessage">
    <p>
      All my best buddies are people I’ve met at work.
      I know you prefer not to make friends at work, and that’s okay!
    </p>

    <p>
      We sit next to each other every day, and I spend so much of
      my workday beside you—so of course I wanted to make your
      birthday a little special! 🎉
    </p>
  </template>

  <template id="supportMessage">
    <p>
      You made my early days in the new role so much easier.
      You probably don’t realize how much you helped!
    </p>

    <p>
      Whenever I felt stressed, I’d turn to you—only to find you
      were even more stressed. Somehow, I found a reason
      to laugh! 😂
    </p>
  </template>

  <template id="thanksMessage">
    <p>
      <p>
      Thank you for making time for my questions, helping me when
      I was figuring things out, and making the workday a little easier. 😊
</p>
    </p>

    <p>
      Your support has meant more than you probably realize.
      I may not say it every day, but I really do appreciate it.
    </p>
  </template>

  <template id="finalMessage">
    <p>
      Wishing you happiness, exciting opportunities, well-deserved
      success, and a little less work stress this year!
    </p>

    <p>
      May the coming year bring you closer to everything you want,
      with plenty of wonderful moments to enjoy along the way.
    </p>

    <p>
      Enjoy your special day, Shristi.
      I hope it leaves you with a big smile! 🎉💛
    </p>
  </template>

  <script>
    const audio = document.getElementById("birthdayAudio");
    const giftScreen = document.getElementById("giftScreen");
    const giftImage = document.getElementById("giftImage");
    const giftFallback = document.getElementById("giftFallback");
    const birthdayCard = document.getElementById("birthdayCard");
    const messageTitle = document.getElementById("messageTitle");
    const messageBody = document.getElementById("messageBody");
    const decoration = document.getElementById("decoration");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const progress = document.getElementById("progress");

    const messages = [
      {
        title: "Happiest Birthday, Shristi!",
        template: "openingMessage",
        emoji: "🎂✨"
      },
      {
        title: "From the person sitting next to you…",
        template: "workplaceMessage",
        emoji: "🎁😄"
      },
      {
        title: "Something I appreciate about you",
        template: "supportMessage",
        emoji: "☕🌟"
      },
      {
        title: "A little thank you",
        template: "thanksMessage",
        emoji: "🌼💛"
      },
      {
        title: "Have a wonderful birthday!",
        template: "finalMessage",
        emoji: "🎉🎂"
      }
    ];

    let currentMessage = 0;
    let animationFrame = null;
    let typingGeneration = 0;

    // Milliseconds per character. Increase for slower typing.
    const typingSpeed = 12;

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const segmenter =
      typeof Intl.Segmenter === "function"
        ? new Intl.Segmenter("en", { granularity: "grapheme" })
        : null;

    function splitCharacters(text) {
      return segmenter
        ? Array.from(segmenter.segment(text), item => item.segment)
        : Array.from(text);
    }

    function showGiftFallback() {
      giftImage.hidden = true;
      giftFallback.hidden = false;
    }

    giftImage.addEventListener("error", showGiftFallback);

    if (giftImage.complete && giftImage.naturalWidth === 0) {
      showGiftFallback();
    }

    function stopTyping() {
      typingGeneration += 1;

      if (animationFrame !== null) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }

      messageBody.removeAttribute("aria-busy");
    }

    function typeMessage(template) {
      const generation = typingGeneration;
      const paragraphs = Array.from(template.content.children);
      const parts = [];
      let totalCharacters = 0;

      messageBody.replaceChildren();

      // Prepare paragraphs while preserving their classes.
      paragraphs.forEach(source => {
        const element = source.cloneNode(false);
        const text = source.textContent.replace(/\s+/g, " ").trim();
        const characters = splitCharacters(text);

        element.hidden = true;
        messageBody.appendChild(element);

        parts.push({
          element,
          characters,
          start: totalCharacters,
          shown: 0
        });

        totalCharacters += characters.length;
      });

      messageBody.setAttribute("aria-busy", "true");

      const startTime = performance.now();

      function tick(now) {
        if (generation !== typingGeneration) {
          return;
        }

        const visibleCharacters = Math.min(
          totalCharacters,
          Math.floor((now - startTime) / typingSpeed) + 1
        );

        parts.forEach(part => {
          const count = Math.max(
            0,
            Math.min(
              part.characters.length,
              visibleCharacters - part.start
            )
          );

          if (count > part.shown) {
            part.element.hidden = false;

            // Only add characters. Never delete or type backward.
            part.element.append(
              document.createTextNode(
                part.characters.slice(part.shown, count).join("")
              )
            );

            part.shown = count;
          }
        });

        if (visibleCharacters < totalCharacters) {
          animationFrame = requestAnimationFrame(tick);
        } else {
          animationFrame = null;
          messageBody.removeAttribute("aria-busy");
        }
      }

      animationFrame = requestAnimationFrame(tick);
    }

    function showMessage(index) {
      stopTyping();

      const message = messages[index];
      const template = document.getElementById(message.template);

      messageTitle.textContent = message.title;
      decoration.textContent = message.emoji;

      previousButton.hidden = index === 0;
      nextButton.hidden = index === messages.length - 1;
      progress.textContent = `${index + 1} of ${messages.length}`;

      // Respect the device's accessibility preference.
      if (reducedMotion.matches) {
        messageBody.replaceChildren(
          template.content.cloneNode(true)
        );
      } else {
        typeMessage(template);
      }

      window.scrollTo({ top: 0, behavior: "instant" });
      messageTitle.focus({ preventScroll: true });
    }

    document.getElementById("openGift").addEventListener("click", () => {
      giftScreen.hidden = true;
      birthdayCard.hidden = false;

      showMessage(currentMessage);

      audio.volume = 0.5;

      audio.play().catch(() => {
        // Continue normally if music is unavailable.
      });
    });

    previousButton.addEventListener("click", () => {
      if (currentMessage > 0) {
        currentMessage -= 1;
        showMessage(currentMessage);
      }
    });

    nextButton.addEventListener("click", () => {
      if (currentMessage < messages.length - 1) {
        currentMessage += 1;
        showMessage(currentMessage);
      }
    });
  </script>
</body>
</html>
